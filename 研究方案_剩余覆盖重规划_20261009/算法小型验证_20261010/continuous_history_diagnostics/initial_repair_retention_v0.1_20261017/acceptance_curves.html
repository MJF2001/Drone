ata.filter(r=>r.map_id===map.value&&r.budget===b),ps=rs.flatMap(r=>r.points),ctx=document.getElementById('chart').getContext('2d');ctx.clearRect(0,0,1100,520);let lo=Math.min(...ps.map(p=>p.steps)),hi=Math.max(...ps.map(p=>p.steps));if(hi===lo){lo--;hi++;}const pad=(hi-lo)*.05;lo-=pad;hi+=pad;const X=t=>80+980*t/b,Y=v=>460-420*(v-lo)/(hi-lo);ctx.font='13px system-ui';ctx.fillStyle='#333';ctx.strokeStyle='#ddd';ctx.setLineDash([]);for(let i=0;i<=5;i++){let t=b*i/5;ctx.beginPath();ctx.moveTo(X(t),40);ctx.lineTo(X(t),460);ctx.stroke();ctx.fillText(t.toFixed(b===1?1:0),X(t)-8,485);let v=lo+(hi-lo)*i/5;ctx.fillText(Math.round(v),12,Y(v)+4);}ctx.fillText('公共入口 elapsed / 秒',480,512);ctx.fillText('完整路线步数',12,22);rs.forEach(r=>{if(!r.points.length)return;ctx.strokeStyle=colors[methods.indexOf(r.method)];ctx.lineWidth=2;ctx.setLineDash(r.repeat?[6,4]:[]);ctx.beginPath();let p=r.points[0];ctx.moveTo(X(p.t),Y(p.steps));for(let q of r.points.slice(1)){ctx.lineTo(X(q.t),Y(p.steps));ctx.lineTo(X(q.t),Y(q.steps));p=q;}ctx.lineTo(X(Math.min(b,r.seconds)),Y(p.steps));ctx.stroke();ctx.setLineDash([]);for(let q of r.points){ctx.beginPath();ctx.arc(X(q.t),Y(q.steps),2.3,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill();}});document.getElementById('details').innerHTML='<tr><th>方法</th><th>repeat</th><th>最终步数</th><th>返回秒数</th><th>接受点数</th></tr>'+rs.map(r=>`<tr><td>${r.method}</td><td>${r.repeat}</td><td>${r.points.at(-1)?.steps??'无输出'}</td><td>${r.seconds.toFixed(6)}</td><td>${r.points.length}</td></tr>`).join('');}map.onchange=budget.onchange=draw;draw();</script></html>
